name: Publish Android release

on:
  push:
    branches: [main]
    paths: ['dist/**', '.github/workflows/publish.yml', '.github/scripts/publish_release.py']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-android-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v0.8.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify signed package and collect matching source
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check SHA256SUMS.txt)
          mkdir release-assets
          cp dist/shiguang-album.apk release-assets/
          git archive --format=zip --output=release-assets/shiguang-album-0.8.0-source.zip HEAD -- android-app README.md LICENSE CHANGELOG.md .gitignore
          (cd release-assets && sha256sum shiguang-album.apk shiguang-album-0.8.0-source.zip > SHA256SUMS.txt)
      - name: Upload all assets before publishing the release
        timeout-minutes: 6
        shell: bash
        run: python3 -u .github/scripts/publish_release.py
